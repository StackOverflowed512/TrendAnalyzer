# .github/workflows/ai-pr-review.yml

name: AI PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download PR Diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3.diff" \
            "${{ github.event.pull_request.url }}" \
            -o pr.diff

          echo "Diff lines:"
          wc -l pr.diff

      - name: Create Prompt
        run: |
          cat > prompt.txt << 'EOF'
          You are a senior software engineer performing a pull request review.

          Rules:
          - Only report issues you are highly confident about.
          - Ignore formatting and style nitpicks.
          - Focus on:
            - Bugs
            - Security vulnerabilities
            - Performance issues
            - Missing error handling
            - Missing validation
            - Missing tests

          Return markdown only.

          Structure:

          ## Summary

          Short overall assessment.

          ## Findings

          For each issue:

          ### Issue
          Severity: High|Medium|Low

          Problem:
          ...

          Suggested Fix:
          ...

          File:
          ...

          EOF

          echo "" >> prompt.txt
          echo "===== PR DIFF =====" >> prompt.txt
          cat pr.diff >> prompt.txt

      - name: Call Mistral
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          jq -n \
            --rawfile prompt prompt.txt \
            '{
              model: "mistral-small-latest",
              messages: [
                {
                  role: "user",
                  content: $prompt
                }
              ],
              temperature: 0.1
            }' > request.json

          curl -s \
            https://api.mistral.ai/v1/chat/completions \
            -H "Authorization: Bearer $MISTRAL_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json \
            > response.json

          cat response.json

      - name: Extract Review
        run: |
          jq -r '.choices[0].message.content' response.json > review.md

          echo "Generated review:"
          cat review.md

      - name: Post Review Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const body = fs.readFileSync('review.md', 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
